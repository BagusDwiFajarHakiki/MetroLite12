name: Build Unsigned IPA (iOS 12)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Unsigned .app
        run: |
          xcodebuild \
            -project MetroLite12.xcodeproj \
            -scheme MetroLite12 \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            clean build

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/MetroLite12.app Payload/
          zip -r MetroLite12-iOS12.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroLite12-iOS12-IPA
          path: MetroLite12-iOS12.ipa