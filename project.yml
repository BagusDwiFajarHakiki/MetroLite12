name: MetroLite12
options:
  bundleIdPrefix: com.local.metrolite
  deploymentTarget:
    iOS: "12.0"
targets:
  MetroLite12:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Resources
    info:
      path: Sources/Info.plist
    dependencies:
      - sdk: WebKit.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"